name: RTICORE AI isolated candidate UAT deploy

on:
  push:
    branches:
      - fix/rticore-ai-chat-composer-mobile-20261022
    paths:
      - .github/workflows/rticore-ai-uat-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-isolated-uat:
    runs-on: ubuntu-latest
    environment: rticore-uat
    timeout-minutes: 25
    concurrency:
      group: rticore-ai-uat-deploy
      cancel-in-progress: false
    steps:
      - name: Refuse retired legacy remote operation
        run: |
          echo 'BLOCKED: legacy remote deployment/UAT retired; use native Hostinger release.'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Verify UI regression and types
        run: npm run test:layout && npm run typecheck
      - name: Fail-closed isolated Worker and D1 binding check
        env:
          RTICORE_AI_UAT_DEPLOY_APPROVED: YES_ISOLATED_UAT_ONLY
          RTICORE_AI_UAT_WORKER: uat-rticore
          RTICORE_AI_UAT_DB: eaed652e-7322-4950-a304-dd50baa5de02
          CLOUDFLARE_API_TOKEN: ${{ secrets.RTICORE_UAT_CF_DEPLOY_TOKEN }}
        run: node scripts/rticore-ai-uat-deploy-preflight.mjs
      - name: Build Cloudflare Worker
        run: npx opennextjs-cloudflare build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Deploy UAT only (never production)
        run: npx wrangler deploy --config wrangler.uat.ci.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RTICORE_UAT_CF_DEPLOY_TOKEN }}
      - name: Verify candidate deployment and retained isolated binding
        env:
          RTICORE_AI_UAT_DEPLOY_APPROVED: YES_ISOLATED_UAT_ONLY
          RTICORE_AI_UAT_WORKER: uat-rticore
          RTICORE_AI_UAT_DB: eaed652e-7322-4950-a304-dd50baa5de02
          CLOUDFLARE_API_TOKEN: ${{ secrets.RTICORE_UAT_CF_DEPLOY_TOKEN }}
        run: |
          node scripts/rticore-ai-uat-deploy-preflight.mjs
          echo 'Worker UAT isolation verified; actual Admin Access and OpenRouter UAT remain a separate mandatory gate.'
