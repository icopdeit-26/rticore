name: Operational Finance Outbox Acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['fix/operational-finance-outbox-20261127']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operational-outbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rticore_ci
          POSTGRES_PASSWORD: rticore_ci_only
          POSTGRES_DB: rticore_atomic_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:pricing && npm run test:flexguard && npm run test:psa-timesheets && npm run test:service-operations
      - name: PostgreSQL atomicity, entity FKs and canonical trigger acceptance
        run: node --experimental-strip-types --test --test-concurrency=1 tests/rticore-postgres-atomic-live.test.cjs tests/finance-entity-constraints-live.test.cjs tests/postgres-canonical-triggers-live.test.cjs tests/business-iam-postgres.test.cjs
        env:
          RTICORE_ATOMIC_TEST_URL: postgresql://rticore_ci:rticore_ci_only@127.0.0.1:5432/rticore_atomic_ci
      - run: npm run build
