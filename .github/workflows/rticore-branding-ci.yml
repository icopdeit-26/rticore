name: RTICORE Brand Consistency
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/rticore-branding.test.cjs'
      - 'package.json'
      - '.github/workflows/rticore-branding-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/rticore-branding.test.cjs'
      - 'package.json'
jobs:
  brand-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies for isolated branding regression
        run: npm ci --no-audit --no-fund
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Check RTICORE/RTI branding
        run: npm run test:branding
      - name: Regression tests for login, sidebar, quotation and assistant
        run: node --experimental-strip-types --test tests/rticore-login-experience.test.cjs tests/rticore-access-entrypoints.test.cjs tests/enterprise-navigation.test.cjs tests/quotation-docx.test.cjs tests/quotation-layout.test.cjs
