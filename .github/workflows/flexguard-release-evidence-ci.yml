name: FlexGuard release evidence CI
on:
  push:
    branches: ['fix/p0-flexguard-release-evidence']
  pull_request:
    branches: ['integration/v6-erp-finance-20261127', main]
    paths:
      - 'scripts/finance-historical-reconciliation.mjs'
      - 'scripts/hostinger-preflight.mjs'
      - 'tests/finance-historical-reconciliation.test.mjs'
      - '.github/workflows/flexguard-release-evidence-ci.yml'
permissions:
  contents: read
jobs:
  read-only-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --check scripts/hostinger-preflight.mjs
      - run: node --test tests/finance-historical-reconciliation.test.mjs tests/hostinger-schema-inventory.test.mjs
