name: Native IAM smoke contract CI
on:
  push:
    branches: ['fix/p0-business-iam-live-smoke']
  pull_request:
    branches: ['integration/v6-erp-finance-20261127', main]
    paths:
      - 'scripts/native-iam-smoke.mjs'
      - 'tests/native-iam-smoke.test.mjs'
      - '.github/workflows/rticore-native-iam-smoke.yml'
      - '.github/workflows/native-iam-smoke-contract-ci.yml'
permissions:
  contents: read
jobs:
  smoke-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/native-iam-smoke.test.mjs
