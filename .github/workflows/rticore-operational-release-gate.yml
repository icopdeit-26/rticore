name: RTICORE Operational Release Gate Evidence
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/rticore-operational-gate.mjs
      - scripts/rticore-d1-0028-restore-rehearsal.py
      - tests/rticore-operational-release-gate.test.cjs
      - .github/workflows/rticore-operational-release-gate.yml
      - docs/RTICORE_OPERATIONAL_RELEASE_GATE_20261024.md
  workflow_dispatch:
    inputs:
      mode:
        description: 'OFFLINE: synthetic regression only; LIVE_READONLY: isolated Worker/Access/D1 preflight'
        required: true
        type: choice
        options: [OFFLINE, LIVE_READONLY]
permissions:
  contents: read
concurrency:
  group: rticore-operational-gate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Python
        run: python3 --version
      - name: Fail-closed controls and independent SQLite restore/rollback on synthetic fixture
        run: node --test tests/rticore-operational-release-gate.test.cjs
      - name: Validate JavaScript syntax
        run: node --check scripts/rticore-operational-gate.mjs
  live_control_plane:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'LIVE_READONLY' }}
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: rticore-uat
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify dedicated candidate Worker, isolated D1 and protected Access roster
        env:
          RTICORE_GATE_WORKER_NAME: ${{ vars.RTICORE_GATE_WORKER_NAME }}
          RTICORE_GATE_D1_ID: ${{ vars.RTICORE_GATE_D1_ID }}
          RTICORE_GATE_SHA: ${{ github.sha }}
          RTICORE_GATE_ACCESS_APP_ID: ${{ vars.RTICORE_GATE_ACCESS_APP_ID }}
          RTICORE_GATE_TOKEN: ${{ secrets.RTICORE_GATE_READ_ONLY_TOKEN }}
        run: node scripts/rticore-operational-gate.mjs --preflight
# This workflow NEVER deploys, changes D1, publishes backups or marks production PASS.
