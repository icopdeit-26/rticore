name: RTICORE ERP additional 210 UAT catalog integrity
on:
  push:
    paths:
      - 'docs/RTICORE_ERP_UAT_210_CATALOG.json'
      - 'docs/RTICORE_UAT_210_CATALOG.json'
      - 'tests/rticore-erp-uat-catalog.test.cjs'
      - '.github/workflows/rticore-erp-uat-catalog-ci.yml'
  pull_request:
    paths:
      - 'docs/RTICORE_ERP_UAT_210_CATALOG.json'
      - 'docs/RTICORE_UAT_210_CATALOG.json'
      - 'tests/rticore-erp-uat-catalog.test.cjs'
      - '.github/workflows/rticore-erp-uat-catalog-ci.yml'
permissions:
  contents: read
jobs:
  validate-catalog-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate scenario definitions (not business UAT execution)
        run: node --test tests/rticore-erp-uat-catalog.test.cjs
