name: RTICORE 420-case operational certification evidence gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/rticore-release-evidence.mjs'
      - 'tests/release-evidence.test.cjs'
      - 'tests/rticore-erp-uat-catalog.test.cjs'
      - 'docs/RTICORE_ENTERPRISE_OPERATIONAL_CERTIFICATION_20261031.md'
      - '.github/workflows/rticore-operational-certification-420-ci.yml'
permissions:
  contents: read
jobs:
  signed-evidence-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Existing 210 + ERP 210 catalogs and independent signing rejection tests
        run: node --test tests/release-evidence.test.cjs tests/rticore-erp-uat-catalog.test.cjs
      - name: Release evidence script syntax
        run: node --check scripts/rticore-release-evidence.mjs
      - name: Explicitly label synthetic checks as NOT operational certification
        run: |
          echo 'PASS: certification validator and negative controls only'
          echo 'NOT CERTIFIED: no real Cloudflare Access UAT, human signatures or independent backup proven'
# No D1 writes, no token or user email in stdout, no auto certification or deploy.
