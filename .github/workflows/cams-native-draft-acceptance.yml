name: CAMS Native GL Acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/cams-finance-docking-01']
permissions:
  contents: read
jobs:
  native-gl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cams_docking_ci
          POSTGRES_USER: cams_ci
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cams_ci -d cams_docking_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: cams_ci
      PGPASSWORD: isolated-ci-only
      PGDATABASE: cams_docking_ci
    steps:
      - uses: actions/checkout@v4
      - name: Apply real native PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f rticore_postgresql_schema.sql
      - name: Install real native business triggers
        run: psql -v ON_ERROR_STOP=1 -f rticore_postgresql_triggers.sql
      - name: Apply docking migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f sql/native-postgres/0053_cams_finance_inbox.sql
          psql -v ON_ERROR_STOP=1 -f sql/native-postgres/0054_cams_draft.sql
      - name: Verify draft, duplicate replay, dimensions, SoD and rollback
        run: psql -v ON_ERROR_STOP=1 -f tests/cams-native-draft-acceptance.sql
