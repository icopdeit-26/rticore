name: CAMS Finance Docking Contract
on:
  push:
    branches: ['feature/cams-finance-docking-01','fix/cams-cost-center-scope-20261127','fix/cams-native-hostinger-20261127']
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/cams-journal-contract.test.cjs
      - run: npm run typecheck
