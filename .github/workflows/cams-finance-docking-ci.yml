name: CAMS Finance Docking Contract
on:
  push:
    branches: ['feature/cams-finance-docking-01']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/cams-journal-contract.test.cjs
      - run: npm run typecheck
