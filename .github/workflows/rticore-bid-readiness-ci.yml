name: RTICORE Tender Compliance Bid Readiness
on:
  push:
    branches: [feat/rticore-tender-bid-readiness-20261022, feat/rticore-ag-vault-tender-integration-20261022]
  pull_request:
    branches: [main, feat/rticore-p1-p2-integration-20261022, feat/rticore-tender-bid-readiness-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Bid readiness security and SQLite D1 regressions
        run: npm run test:bid-readiness && npm run test:p1-p2
      - name: Seven-role Marketing Sales regressions
        run: npm run test:sales && npm run test:marketing && npm run test:rticore-negative
      - name: Typecheck
        run: npm run typecheck
      - name: Cloudflare Next.js worker packaging
        run: npm run build:cf
        env:
          NEXT_TELEMETRY_DISABLED: '1'
