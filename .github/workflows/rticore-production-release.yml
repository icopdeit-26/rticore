name: RTICORE production release - backup, rename, migrate, verify, deploy

# Manual-only controlled release. Authorised by the repository owner / business owner on 2026-11-01 to lift the
# earlier P0 hard hold. The objections that caused the hold are addressed here, not removed:
#
#  1. No automatic trigger. There is no `push:` trigger and the run requires a typed confirmation string, so
#     production is never changed by merging code.
#  2. No production data leaves Cloudflare. THIS REPOSITORY IS PUBLIC, so the D1 export is kept only on the
#     ephemeral runner and never uploaded as an artifact; only its size and SHA-256 are printed. Rollback uses the
#     server-side D1 Time Travel bookmark.
#  3. Recovery is operator-controlled. A failed or interrupted deploy can still change the
#     remote Worker, and writes may occur after the backup bookmark.
#  4. Pre-rebrand production. The deployed Worker and D1 still carry the india_* schema. The schema is renamed once
#     from the live sqlite_master. The old Worker cannot read the renamed schema, so expect errors from the start of
#     the migrate step until the deploy finishes, and run this in a maintenance window. The Worker is not rolled
#     back on its own after a rename, because the previous version would have no tables to read.
#
# Order: gates -> build -> target checks -> preflight -> D1 export + Time Travel bookmark -> schema rename
#        -> pending migrations -> data/schema/control verification -> deploy Worker -> authenticated smoke -> operator recovery if needed.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: DEPLOY RTICORE PRODUCTION'
        required: true
        type: string
      apply_migrations:
        description: 'Rename the legacy schema if needed and apply pending D1 migrations (through 0051)'
        required: true
        default: true
        type: boolean
permissions:
  contents: read

concurrency:
  group: rticore-production-release
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 208155f241d4da84e1a6a9b44b7a8d28
  # The existing production resources kept their pre-rebrand names. Deploying as "rticore" would create a second
  # Worker with no secrets, so the runner's wrangler.jsonc is pointed at these before anything is built.
  D1_NAME: india-staging-db
  WORKER: india
  NEXT_TELEMETRY_DISABLED: '1'
  CI: 'true'

jobs:
  release:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require typed confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = "DEPLOY RTICORE PRODUCTION"

      - name: Require Cloudflare deploy token (value never printed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "BLOCKED: CLOUDFLARE_API_TOKEN secret is not configured. Nothing was changed."; exit 2
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Point the runner's wrangler config at the existing production resources
        run: |
          sed -i "s/\"name\": \"rticore\"/\"name\": \"$WORKER\"/; s/\"database_name\": \"rticore-staging-db\"/\"database_name\": \"$D1_NAME\"/" wrangler.jsonc
          grep -q "\"name\": \"$WORKER\"" wrangler.jsonc
          grep -q "\"database_name\": \"$D1_NAME\"" wrangler.jsonc

      - name: Release gates (source guards, rename rehearsal, role suites, ERP regression, types)
        run: |
          node scripts/rticore-production-workflow-guard.mjs
          node scripts/rticore-p0-source-gate.mjs
          npm run test:d1-rename
          node --test tests/production-http-smoke.test.cjs
          npm run test:project-manager
          npm run test:offense-team
          npm run test:defense-team
          npm run test:governance-team
          npm run test:itdev-team
          npm run test:erp
          npm run test:erp:extensions
          npm run test:modules-13-15
          npm run typecheck

      - name: Build Worker bundle before touching production
        run: npx opennextjs-cloudflare build

      - name: Validate smoke target and Access session configuration
        env:
          BASE_URL: ${{ secrets.RTICORE_BASE_URL }}
          ACCESS_SESSION: ${{ secrets.RTICORE_SMOKE_ACCESS_SESSION }}
        run: node scripts/release/verify-production-http.mjs --preflight

      - name: Confirm the production Worker exists and holds its encryption secrets (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER/settings")
          if [ "$code" != "200" ]; then echo "BLOCKED: Worker '$WORKER' not found (HTTP $code). Nothing was changed."; exit 2; fi
          npx wrangler secret list --name "$WORKER" --format json > secrets.json
          node -e "const names=JSON.parse(require('fs').readFileSync('secrets.json','utf8')).map(s=>s.name);for(const k of ['AI_ENCRYPTION_KEY','DOCUMENT_ENCRYPTION_KEY'])if(!names.includes('RTICORE_'+k)&&!names.includes('INDIA_'+k)){console.error('BLOCKED: Worker secret missing for '+k+'. Nothing was changed.');process.exit(2)}console.log('encryption secrets present')"

      - name: Preflight - classify production schema and record row counts (counts only, no data)
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$D1_NAME" --remote --json --command "SELECT type,name,tbl_name,sql FROM sqlite_master" > sqlite-master.json
          STATE=$(node scripts/release/d1-legacy-rename.mjs classify sqlite-master.json)
          echo "schema state: $STATE"
          case "$STATE" in
            legacy) P=india ;;
            renamed) P=rticore ;;
            v3-rti) echo "BLOCKED: production already runs the v3-RTI migrations, whose 0046-0051 differ from this branch. Merge that line first. Nothing was changed."; exit 2 ;;
            *) echo "BLOCKED: unexpected schema state '$STATE'. Nothing was changed."; exit 2 ;;
          esac
          if [ "$STATE" = "legacy" ] && [ "${{ inputs.apply_migrations }}" != "true" ]; then
            echo "BLOCKED: this code cannot read the legacy schema, so apply_migrations must be on. Nothing was changed."; exit 2
          fi
          q() { npx wrangler d1 execute "$D1_NAME" --remote --json --command "$1" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(JSON.stringify(j[0].results))})"; }
          V=$(q "SELECT coalesce(max(version),0) v FROM ${P}_schema_migrations")
          echo "schema: $V"
          N=$(echo "$V" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s)[0].v)))")
          if [ "$STATE" = "legacy" ] && [ "$N" -gt 45 ]; then
            echo "BLOCKED: legacy schema is past 0045 with unknown migrations. Nothing was changed."; exit 2
          fi
          # Unmerged branch feat/india-v3-rti-wp00-wp01-wp06-20261101 reuses numbers 0046-0050 and moves data to tenant 'rti'.
          M=$(q "SELECT count(*) n FROM sqlite_master WHERE type='table' AND name='rticore_scoping_model_settings'")
          if [ "$N" -ge 46 ] && ! echo "$M" | grep -q '"n":1'; then
            echo "BLOCKED: production schema is at $N from a different migration lineage. Nothing was changed."; exit 2
          fi
          T=$(q "SELECT (SELECT count(*) FROM ${P}_sales_opportunities WHERE tenant_id<>'defendit360')+(SELECT count(*) FROM ${P}_boq WHERE tenant_id<>'defendit360')+(SELECT count(*) FROM ${P}_document_vault WHERE tenant_id<>'defendit360') n")
          echo "rows off the application tenant key: $T"
          if ! echo "$T" | grep -q '"n":0'; then
            echo "BLOCKED: some rows are not on tenant defendit360, which this code reads. Nothing was changed."; exit 2
          fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          q "SELECT (SELECT count(*) FROM ${P}_sales_opportunities) opportunities,(SELECT count(*) FROM ${P}_boq) boq,(SELECT count(*) FROM ${P}_document_vault) vault,(SELECT count(*) FROM ${P}_members) members" > preflight.json
          cat preflight.json
          echo "triggers: $(q "SELECT count(*) n FROM sqlite_master WHERE type='trigger'")"

      - name: Independent backup - D1 export kept on runner only, plus Time Travel bookmark
        id: backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p backup
          npx wrangler d1 export "$D1_NAME" --remote --output backup/d1-before-release.sql
          # Public repository: the dump is NEVER uploaded. Only its fingerprint is published.
          echo "backup bytes: $(wc -c < backup/d1-before-release.sql)"
          echo "backup sha256: $(sha256sum backup/d1-before-release.sql | cut -d' ' -f1)"
          npx wrangler d1 time-travel info "$D1_NAME" --json > backup/time-travel.json
          BOOKMARK=$(node -e "const j=require('./backup/time-travel.json');process.stdout.write(String(j.bookmark||''))")
          test -n "$BOOKMARK" || { echo "BLOCKED: no Time Travel bookmark; refusing to migrate"; exit 2; }
          echo "bookmark=$BOOKMARK" >> "$GITHUB_OUTPUT"
          echo "Pre-release D1 bookmark: $BOOKMARK"

      - name: Record current Worker version for rollback
        id: checkpoint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module > prev.txt <<'NODE'
          const r = await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${process.env.WORKER}/deployments`, { headers: { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN } });
          const j = await r.json();
          const versions = j?.result?.deployments?.[0]?.versions;
          if (!r.ok || j.success !== true || versions?.length !== 1 || versions[0].percentage !== 100 ||
              !/^[a-f0-9-]{36}$/i.test(versions[0].version_id))
            throw Error('Expected a single active Worker version for recovery');
          process.stdout.write(versions[0].version_id);
          NODE
          echo "previous_version=$(cat prev.txt)" >> "$GITHUB_OUTPUT"
          echo "Previous Worker version: $(cat prev.txt)"

      - name: Rename legacy schema, then apply pending migrations in order (stop at first failure)
        if: inputs.apply_migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ steps.preflight.outputs.state }}" = "legacy" ]; then
            node scripts/release/d1-legacy-rename.mjs generate sqlite-master.json rename-legacy-schema.sql
            npx wrangler d1 execute "$D1_NAME" --remote --file rename-legacy-schema.sql --yes
          fi
          CURRENT=$(npx wrangler d1 execute "$D1_NAME" --remote --json --command "SELECT coalesce(max(version),0) v FROM rticore_schema_migrations" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(String(j[0].results[0].v))})")
          echo "Production schema version before: $CURRENT"
          for f in $(ls migrations/*.sql | sort); do
            n=$((10#$(basename "$f" | cut -c1-4)))
            if [ "$n" -gt "$CURRENT" ]; then
              echo "Applying $f"
              npx wrangler d1 execute "$D1_NAME" --remote --file "$f" --yes
            fi
          done

      - name: Verify schema, names, controls and row preservation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          q() { npx wrangler d1 execute "$D1_NAME" --remote --json --command "$1" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(JSON.stringify(j[0].results))})"; }
          EXPECTED=$((10#$(ls migrations/*.sql | sort | tail -1 | xargs basename | cut -c1-4)))
          V=$(q "SELECT max(version) v FROM rticore_schema_migrations"); echo "schema: $V (expected $EXPECTED)"; echo "$V" | grep -q "\"v\":$EXPECTED"
          L=$(q "SELECT count(*) n FROM sqlite_master WHERE name LIKE '%india%' OR sql LIKE '%india%'"); echo "objects on legacy names: $L"; echo "$L" | grep -q '"n":0'
          K=$(q "SELECT (SELECT count(*) FROM rticore_sales_opportunities WHERE tenant_id<>'defendit360')+(SELECT count(*) FROM rticore_boq WHERE tenant_id<>'defendit360')+(SELECT count(*) FROM rticore_document_vault WHERE tenant_id<>'defendit360') n")
          echo "rows off the application tenant key: $K"; echo "$K" | grep -q '"n":0'
          q "SELECT (SELECT count(*) FROM rticore_sales_opportunities) opportunities,(SELECT count(*) FROM rticore_boq) boq,(SELECT count(*) FROM rticore_document_vault) vault,(SELECT count(*) FROM rticore_members) members" > postflight.json
          cat postflight.json
          node -e "const a=require('./preflight.json')[0],b=require('./postflight.json')[0];for(const k of Object.keys(a))if(a[k]!==b[k]){console.error('ROW COUNT CHANGED for '+k+': '+a[k]+' -> '+b[k]);process.exit(1)}console.log('row counts preserved')"
          echo "triggers after: $(q "SELECT count(*) n FROM sqlite_master WHERE type='trigger'")"
          F=$(q "PRAGMA foreign_key_check"); echo "fk violations: $F"; test "$F" = "[]"

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_TOKEN }}
        run: npx opennextjs-cloudflare deploy

      - name: Verify authenticated HTTP response and D1 schema
        env:
          BASE_URL: ${{ secrets.RTICORE_BASE_URL }}
          ACCESS_SESSION: ${{ secrets.RTICORE_SMOKE_ACCESS_SESSION }}
        run: node scripts/release/verify-production-http.mjs

      - name: Record recovery checkpoint for operator review
        if: failure() && steps.backup.outputs.bookmark != ''
        env:
          BOOKMARK: ${{ steps.backup.outputs.bookmark }}
          PREVIOUS_VERSION: ${{ steps.checkpoint.outputs.previous_version }}
        run: |
          echo "Previous Worker: $PREVIOUS_VERSION"
          echo "Pre-release D1 bookmark: $BOOKMARK"
          echo "Check the active Worker and schema, and stop all writers before deciding whether to restore."
          echo "Reconcile writes since the bookmark and recover a compatible Worker and schema together."
