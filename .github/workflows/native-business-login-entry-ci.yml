name: Native Business Login Entry CI
on:
  push:
    branches: ['fix/p0-business-login-entry-20261128', 'integration/v6-erp-finance-20261127', 'main']
  pull_request:
    paths:
      - 'src/middleware.ts'
      - 'tests/middleware-route-gate.test.cjs'
      - 'src/app/page.tsx'
      - 'src/app/layout.tsx'
      - 'src/app/login/page.tsx'
      - 'src/components/auth/**'
      - 'src/components/layout/AppShell.tsx'
      - 'tests/native-business-login-entry.test.cjs'
      - 'tests/rticore-access-entrypoints.test.cjs'
      - '.github/workflows/native-business-login-entry-ci.yml'
permissions:
  contents: read
jobs:
  native-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/native-business-login-entry.test.cjs tests/rticore-login-experience.test.cjs tests/middleware-route-gate.test.cjs tests/rticore-access-entrypoints.test.cjs
      - run: npm run typecheck
      - run: npm run build
      - name: HTTP smoke on disposable native server (no production secrets)
        run: |
          set -eu
          export RTICORE_RUNTIME=hostinger RTICORE_AUTH_MODE=business RTICORE_LOCAL_MODE=0 RTICORE_DB_ENGINE=postgres RTICORE_PUBLIC_ORIGIN=https://example.invalid
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 -p 3199 > /tmp/rticore-login.log 2>&1 &
          pid=$!
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ]; then tail -n 60 /tmp/rticore-login.log >&2; fi
            kill "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3199/api/health/live >/dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then echo 'Next server exited before readiness'; exit 1; fi
            sleep 1
          done
          test "$ready" = 1 || { echo 'Next server did not reach liveness'; exit 1; }
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='http://127.0.0.1:3199';
          const login=await fetch(base+'/login',{redirect:'manual'});
          const html=await login.text();
          console.log('login HTTP',login.status,'native heading',html.includes('Native Secure Login'),'MFA action',html.includes('Masuk dengan MFA'),'OTP label',html.includes('Kode 2FA'));
          assert.equal(login.status,200);
          assert.ok(html.includes('Native Secure Login'),'native login view missing');
          assert.ok(html.includes('Masuk dengan MFA'),'MFA action missing');
          assert.ok(html.includes('Kode 2FA'),'OTP input missing');
          const root=await fetch(base+'/',{redirect:'manual'});
          console.log('root HTTP',root.status,'location',root.headers.get('location'));
          assert.equal(root.status,307);
          assert.equal(new URL(root.headers.get('location'),base).pathname,'/login');
          const direct=await fetch(base+'/sales/executive',{redirect:'manual'});
          const directHTML=await direct.text();
          console.log('protected page HTTP',direct.status);
          assert.ok((direct.status===307&&new URL(direct.headers.get('location'),base).pathname==='/login')||(direct.status===200&&directHTML.includes('Memverifikasi sesi')),'unauthenticated direct route must be blocked or show identity gate');
          const cross=await fetch(base+'/api/business-auth',{method:'POST',headers:{Origin:'https://invalid.example','Content-Type':'application/json'},body:'{}',redirect:'manual'});
          assert.equal(cross.status,403,'cross-origin mutation must be denied');
          NODE
