name: Native Business Login Entry CI
on:
  push:
    branches: ['fix/p0-business-login-entry-20261128']
  pull_request:
    paths:
      - 'src/app/page.tsx'
      - 'src/app/layout.tsx'
      - 'src/app/login/page.tsx'
      - 'src/components/auth/**'
      - 'src/components/layout/AppShell.tsx'
      - 'tests/native-business-login-entry.test.cjs'
      - '.github/workflows/native-business-login-entry-ci.yml'
permissions:
  contents: read
jobs:
  native-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/native-business-login-entry.test.cjs tests/rticore-login-experience.test.cjs tests/middleware-route-gate.test.cjs
      - run: npm run typecheck
      - run: npm run build
      - name: HTTP smoke on disposable native server (no production secrets)
        run: |
          set -eu
          export RTICORE_RUNTIME=hostinger RTICORE_AUTH_MODE=business RTICORE_LOCAL_MODE=0 RTICORE_DB_ENGINE=postgres RTICORE_PUBLIC_ORIGIN=https://example.invalid
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 -p 3199 > /tmp/rticore-login.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3199/login > /tmp/rticore-login.html; then break; fi
            sleep 1
          done
          grep -q 'Masuk dengan MFA' /tmp/rticore-login.html
          grep -q 'Kode 2FA' /tmp/rticore-login.html
          curl -sS -D /tmp/rticore-headers -o /dev/null http://127.0.0.1:3199/
          grep -Ei '^HTTP/.* 307' /tmp/rticore-headers
          grep -Ei '^location: /login' /tmp/rticore-headers
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Origin: https://invalid.example' -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:3199/api/business-auth)" = 403
