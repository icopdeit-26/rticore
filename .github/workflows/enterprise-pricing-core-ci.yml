name: Enterprise pricing catalog reconciliation CI
on:
  push:
    branches: ['fix/p0-enterprise-pricing-catalog-reconciliation']
  pull_request:
    branches: ['integration/v6-erp-finance-20261127', main]
    paths:
      - 'src/lib/enterprise-pricing-engine.ts'
      - 'tests/enterprise-pricing-core.test.cjs'
      - 'package.json'
      - '.github/workflows/enterprise-pricing-core-ci.yml'
permissions:
  contents: read
jobs:
  pricing-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run test:pricing
      - run: npm run typecheck
