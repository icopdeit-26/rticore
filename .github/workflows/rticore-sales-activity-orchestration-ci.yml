name: RTICORE Sales Activity Orchestration CI
on:
  push:
    branches: [feat/rticore-sales-activity-sla-20261022]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  activity-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Validate scheduled worker syntax
        run: node --check automation/sales-cron/src/index.js
      - name: D1 SLA and escalation integration tests
        run: npm run test:activities
      - name: Existing Marketing Sales and Presales PO regression
        run: npm run test:marketing && npm run test:sales && npm run test:sales-transactions && npm run test:rticore-negative
      - name: TypeScript
        run: npm run typecheck
      - name: Native Next.js enterprise compatibility
        run: npm run build:enterprise
        env:
          NEXT_TELEMETRY_DISABLED: '1'
