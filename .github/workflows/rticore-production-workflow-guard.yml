name: P0 production workflow mutation containment
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/rticore-production-workflow-guard.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/rticore-production-workflow-guard.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-production-triggers:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/rticore-production-workflow-guard.mjs
# This action never writes Cloudflare or accesses sensitive tokens.
