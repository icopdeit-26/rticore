name: RTICORE chat composer hotfix UAT

on:
  push:
    branches:
      - hotfix/rticore-ai-input-visible-android-20261023
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  composer-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Next production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile and desktop chat composer UI regression (mocked AI)
        run: |
          node node_modules/next/dist/bin/next start -H 127.0.0.1 -p 3125 > /tmp/rticore-composer.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3125/ > /dev/null; then break; fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:3125/ > /dev/null; then
            cat /tmp/rticore-composer.log
            exit 1
          fi
          node tests/ai-chat-composer-browser-uat.cjs
        env:
          RTICORE_UAT_BASE: http://127.0.0.1:3125
