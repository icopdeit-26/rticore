name: V6 integration CI and UAT technical suites
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'integration/v6-erp-finance-20261127']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v6-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runner-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --version && git rev-parse HEAD
      - run: node --test tests/hostinger-schema-inventory.test.mjs tests/rticore-hostinger-native-runtime.test.cjs
  erp-catalog-and-regressions:
    needs: runner-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/rticore-uat-420-batches.mjs --batch=${{ matrix.batch }}
      - name: Execute technical regressions (not individual signed business UAT)
        shell: bash
        run: |
          case '${{ matrix.batch }}' in
            1) npm run gate:automated ;;
            2) npm run test:erp && node --test tests/rticore-erp-enterprise-contract.test.cjs ;;
            3) npm run test:erp && npm run test:service-operations ;;
            4) npm run test:erp && npm run test:service-operations ;;
            5) npm run test:psa-timesheets ;;
            6) npm run test:service-operations && npm run test:sales-transactions && npm run test:post-po ;;
            7) npm run test:rticore-negative && node --test tests/rticore-negative-enterprise-matrix.test.cjs tests/release-evidence.test.cjs ;;
            *) exit 2 ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: v6-erp-batch-${{ matrix.batch }}-catalog
          path: artifacts/rticore-uat420/batch-${{ matrix.batch }}.json
          if-no-files-found: error
  finance-520:
    needs: runner-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Finance register and authorization regressions
        run: node --test tests/finance-registers.test.cjs tests/finance-p0-action-authorization.test.cjs
      - name: Execute Finance suite and preserve raw TAP
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run test:finance-520 2>&1 | tee artifacts/finance-520.tap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: finance-520-technical-output
          path: artifacts/finance-520.tap
          if-no-files-found: warn
  native-build:
    needs: runner-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: test -f .next/BUILD_ID
# No production credentials, deployment, or business sign-off.
