name: Native Hostinger health probes CI
on:
  push:
    branches: ['fix/p0-native-health-reconciliation-20261127']
  pull_request:
    branches: ['integration/v6-erp-finance-20261127', main]
    paths:
      - 'src/app/api/health/**'
      - 'src/middleware.ts'
      - 'tests/native-health-probes.test.cjs'
      - 'tests/middleware-route-gate.test.cjs'
      - '.github/workflows/native-health-probes-ci.yml'
permissions:
  contents: read
jobs:
  health-probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/native-health-probes.test.cjs tests/middleware-route-gate.test.cjs
      - run: npm run typecheck
