name: RTICORE Sales Multirole UAT

on:
  push:
    branches:
      - main
      - feat/rticore-sales-pipeline-workflow-20261020
      - feat/rticore-marketing-sales-consolidation-20261022
      - feat/rticore-presales-po-transactions-20261022
      - test/pr12-negative-44-integration-20261021
  pull_request:
    branches:
      - main
      - feat/rticore-sales-pipeline-workflow-20261020
      - feat/rticore-marketing-sales-consolidation-20261022
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multirole-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Seven-role UAT domain and document simulations
        run: npm run test:sales && npm run test:marketing && npm run test:rticore-negative
      - name: Consolidated Marketing Sales schema and PR18 preservation tests
        run: npm run test:consolidation
      - name: BoQ maker checker and quotation tests
        run: npm run test:boq-workflow && npm run test:boq-domain && npm run test:quotation-docx && npm run test:post-po && npm run test:ai
      - name: Presales Proposal Submission Negotiation PO transaction gates
        run: npm run test:sales-transactions
      - name: Vault originals, retention concurrency and corruption gates
        run: npm run test:document-vault
      - name: TypeScript verification
        run: npm run typecheck
      - name: Next production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Install headless Chromium (pre-deployment UAT)
        run: npx playwright install --with-deps chromium
      - name: Full regression and browser UAT for every local role
        run: npm run test:all
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Cloudflare adapter bundle
        run: npx opennextjs-cloudflare build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Save sanitized browser fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rticore-role-browser-fixtures
          path: |
            artifacts/browser-uat/
            artifacts/campaign-browser-uat/
          if-no-files-found: ignore
          retention-days: 7
