name: Wave 10 native release evidence contract
on:
  pull_request:
  push:
    branches: [main, 'integration/v6-erp-finance-20261127']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/native-release-certification.test.mjs tests/hostinger-schema-inventory.test.mjs
      - name: Generate unsigned exact-SHA UAT review inventory
        run: |
          mkdir -p artifacts/batch-e
          node scripts/native-uat-review-register.mjs artifacts/batch-e/native-uat-review.json
      - name: Missing real evidence must fail closed for the expected reason
        run: |
          set +e
          output=$(node scripts/native-release-certification.mjs 2>&1)
          status=$?
          set -e
          test "$status" -eq 1
          printf '%s\n' "$output" | grep -Fx 'NATIVE_RELEASE_HOLD: NATIVE_SIGNED_RECEIPT_REQUIRED'
      - name: Publish unsigned review inventory (not UAT acceptance)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch-e-native-uat-review
          path: artifacts/batch-e/native-uat-review.json
          retention-days: 14
          if-no-files-found: error
