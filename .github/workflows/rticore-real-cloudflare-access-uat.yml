name: RTICORE Real Cloudflare Access UAT (manual only)
on:
  workflow_dispatch:
    inputs:
      target_confirmation:
        description: 'Type RUN_ISOLATED_UAT_ONLY after verifying the UAT Worker is bound to UAT D1'
        required: true
        type: choice
        options:
          - RUN_ISOLATED_UAT_ONLY

permissions:
  contents: read

jobs:
  human-access-uat:
    if: ${{ inputs.target_confirmation == 'RUN_ISOLATED_UAT_ONLY' }}
    runs-on: ubuntu-latest
    environment: rticore-uat
    timeout-minutes: 12
    steps:
      - name: Refuse retired legacy remote operation
        run: |
          echo 'BLOCKED: legacy remote deployment/UAT retired; use native Hostinger release.'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned repository dependencies
        run: npm install --no-audit --no-fund
      - name: Require verified Access JWT for three real identities and isolated D1 binding
        env:
          RTICORE_UAT_BASE_URL: ${{ vars.RTICORE_UAT_BASE_URL }}
          RTICORE_UAT_ALLOWED_HOST: ${{ vars.RTICORE_UAT_ALLOWED_HOST }}
          RTICORE_UAT_WORKER_NAME: ${{ vars.RTICORE_UAT_WORKER_NAME }}
          RTICORE_UAT_D1_ID: eaed652e-7322-4950-a304-dd50baa5de02
          RTICORE_UAT_ALLOW_WRITE: YES_ISOLATED_UAT
          CLOUDFLARE_API_TOKEN: ${{ secrets.RTICORE_UAT_CF_WORKER_READ_TOKEN }}
          RTICORE_ACCESS_TEAM_DOMAIN: ${{ vars.RTICORE_UAT_ACCESS_TEAM_DOMAIN }}
          RTICORE_ACCESS_AUD: ${{ secrets.RTICORE_UAT_ACCESS_AUD }}
          RTICORE_UAT_JWT_SALES_A: ${{ secrets.RTICORE_UAT_JWT_SALES_A }}
          RTICORE_UAT_JWT_SALES_B: ${{ secrets.RTICORE_UAT_JWT_SALES_B }}
          RTICORE_UAT_JWT_ADMIN: ${{ secrets.RTICORE_UAT_JWT_ADMIN }}
          RTICORE_UAT_EMAIL_SALES_A: ${{ vars.RTICORE_UAT_EMAIL_SALES_A }}
          RTICORE_UAT_EMAIL_SALES_B: ${{ vars.RTICORE_UAT_EMAIL_SALES_B }}
          RTICORE_UAT_EMAIL_ADMIN: ${{ vars.RTICORE_UAT_EMAIL_ADMIN }}
        run: node scripts/rticore-cloudflare-access-real-uat.mjs
