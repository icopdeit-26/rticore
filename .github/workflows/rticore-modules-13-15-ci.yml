name: RTICORE Modules 13 14 15 Completion
on:
  push:
    branches: [feat/rticore-modules-13-15-completion-20261022]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Marketing Sales consolidation and isolation
        run: npm run test:consolidation
      - name: Live UAT target and human-session guard regression (offline)
        run: node --test tests/rticore-feasibility-live-access-guard.test.cjs
      - name: Full regression and OpenNext Cloudflare package (never deploy)
        run: npm run build:cf
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npx playwright install --with-deps chromium
      - name: Desktop and Android emulation with actual route handlers and isolated SQLite
        run: node tests/run-modules-browser.cjs
