name: RTICORE Vendor Resource Solution Feasibility
on:
  push:
    branches: [feat/rticore-vendor-resource-feasibility-20261022]
  pull_request:
    branches: [feat/rticore-tender-bid-readiness-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: D1 feasibility, capacity and expiry regression
        run: npm run test:feasibility
      - name: Tender and P1-P2 regression
        run: npm run test:bid-readiness && npm run test:p1-p2
      - name: Sales negative regression
        run: npm run test:sales && npm run test:rticore-negative
      - name: TypeScript compile
        run: npm run typecheck
      - name: OpenNext Cloudflare build
        run: npm run build:enterprise
        env:
          NEXT_TELEMETRY_DISABLED: '1'
